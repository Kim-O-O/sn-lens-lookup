<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<meta name="description" content="박스 바코드로 크리스티 프로젝터 렌즈 종류를 찾는 창고용 조회 페이지">
<title>크리스티 렌즈 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 폰 한 손 조작 — 위에 큰 스캔 버튼, 아래 결과 카드, 맨 아래 전체 목록.
   색 유래: 창고 박스 라벨(크래프트지 바탕·검정 인쇄) + 마운트별 색 = 랙 라벨 색띠처럼 의미 고정 */
:root{
  --bg:#f3efe6; --panel:#fffdf8; --ink:#1c1a16; --mute:#6b655a; --line:#d9d2c3;
  --act:#1c1a16; --act-ink:#fffdf8;
  --hs:#2f6db3;   /* HS */
  --jk:#0f7f86;   /* Jazz·Korus */
  --gs:#8a6d0b;   /* GS */
  --hb:#b4561c;   /* 144 ILS4 HB */
  --uhc:#6a3d9a;  /* 163 ILS4 UHC */
  --ils1:#2e7d4f; /* 118 ILS1 */
  --eos:#7a7468;  /* 단종 */
  --proj:#1c1a16; /* 프로젝터 본체 = 박스 라벨 검정 */
  --warn:#a3261b;
  --mono:'IBM Plex Mono','IBM Plex Sans KR',monospace;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
}
/* U7(F-09, 20261020 UI-개선): 시스템 다크 자동 전환 제거 - 사용자 선호 V1 "html 테마는 항상 밝은 걸로"(20261002).
   계열 색(랙 라벨 색띠)이 기기 설정에 따라 바뀌지 않게 한다. 되돌리려면 원본 27~30행의 @media 블록을 복원. */
:root{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#1a1916; --panel:#24221e; --ink:#eee8dc; --mute:#a59e90; --line:#3a3731;
  --act:#eee8dc; --act-ink:#1a1916;
  --hs:#7fb0ea; --jk:#62c9cf; --gs:#e3c04f; --hb:#f0995e; --uhc:#bf9be6; --ils1:#7fcf9f; --eos:#a59e90; --proj:#eee8dc; --warn:#ff8a7d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-size:20px;margin:0;text-wrap:balance}
.sub{color:var(--mute);font-size:13px;margin:2px 0 0}
.scan{display:flex;flex-direction:column;gap:10px}
.btn{appearance:none;border:0;border-radius:10px;background:var(--act);color:var(--act-ink);font:700 18px var(--sans);padding:18px;width:100%;cursor:pointer}
.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--hs);outline-offset:2px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:600 18px var(--mono);padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);letter-spacing:.04em}
.btn2{appearance:none;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 15px var(--sans);border-radius:8px;padding:0 16px;cursor:pointer}
.status{font-size:13px;color:var(--mute);min-height:1.4em}
.status.err{color:var(--warn)}
#results{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.code{font:600 15px var(--mono);color:var(--mute);letter-spacing:.03em}
.name{font-size:22px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.tag{align-self:flex-start;background:var(--c);color:var(--panel);font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px}
.compat{font-size:13px;color:var(--mute)}
.compat b{color:var(--ink);font-weight:600}
.card a{color:var(--c);font-size:13px}
.note{font-size:13px;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
/* U4(F-05, 20261020 UI-개선): '목록에 없음'은 정보 안내(공용 렌즈)와 다른 경고 모양 - 기존 --warn 토큰 재사용, 새 색 없음 */
.note.miss{border:1.5px solid var(--warn);color:var(--warn);font-size:15px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:-1px}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px}
summary{padding:12px 14px;cursor:pointer;font-weight:600}
.tbl{overflow-x:auto;padding:0 8px 10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
td.m{font-family:var(--mono);white-space:nowrap}
td i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px}
.foot{font-size:12px;color:var(--mute)}
body{margin:0}
.view{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.view{touch-action:none}
.view video{transform-origin:50% 50%;width:100%;height:100%;object-fit:cover;display:block}
.view .aim{position:absolute;left:2%;right:2%;top:25%;height:50%;border:3px solid #ffd400;border-radius:6px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.zoom{display:flex;align-items:center;gap:10px;font-size:14px}.zoom input{flex:1;min-width:0}
.spec{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
body.scanning .view{aspect-ratio:auto}
body.scanning header .sub,body.scanning #camBtn,body.scanning .legend,body.scanning #all,body.scanning .foot,body.scanning .card .compat,body.scanning .card a{display:none}
body.scanning .wrap{gap:10px;padding-block:8px 24px}
body.scanning .card{padding:10px 14px}
body.scanning .name{font-size:24px}
.minor{display:flex;gap:18px;flex-wrap:wrap}
/* U3(F-04, 20261020 UI-개선): 카메라 위 '멈춤'·'코드 입력' 높이 31px → 44px(폰 터치 목표선). 위치·문구는 그대로. */
.ov{position:absolute;z-index:2;appearance:none;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font:600 14px var(--sans);padding:0 14px;min-height:44px;min-width:56px;cursor:pointer}
.ov.tr{top:8px;right:8px}.ov.bl{bottom:8px;left:8px}
/* U2(F-03·F-13, 20261020 UI-개선): 카메라 위 상태 글 - 12px 흰 글자+그림자만 → 13px, .ov 버튼과 같은 반투명 검정 띠 위.
   판독 전(빈칸)에는 할 일 안내를 띄운다(JS 변경 없이 :empty). 위치(위 가운데)는 그대로. */
.ovst{position:absolute;left:0;right:0;top:8px;margin:0 auto;width:fit-content;max-width:calc(100% - 136px);text-align:center;color:#fff;font:600 13px/1.4 var(--sans);background:rgba(0,0,0,.6);border-radius:6px;padding:6px 10px;pointer-events:none}
.ovst:empty::before{content:"바코드를 비추세요\A멀면 두 손가락 확대";white-space:pre-line}
/* U1(F-01, 20261020 UI-개선): 스캔 중에도 '목록에 없음'(.note.miss)은 보인다. 공용 안내 등 다른 .note는 간소화대로 숨김.
   왜: 숨기면 목록 밖 박스를 비췄을 때 결과 칸이 빈칸이라 '아직 못 읽음'과 구별되지 않았다(커밋 9b1dffe '목록에 없는 품번은 표시'의 의도). */
body.scanning header,body.scanning #live,body.scanning .minor,body.scanning #f,body.scanning #st,body.scanning .note:not(.miss){display:none}
body.scanning .view{height:42vh}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;font:14px var(--sans);padding:4px 0;cursor:pointer;align-self:flex-start}
</style>

<div class="wrap">
  <header>
    <h1>크리스티 렌즈·프로젝터 조회</h1>
  </header>

  <section class="scan" aria-label="조회">
    <button class="btn" type="button" id="live">카메라로 스캔</button>
    <div class="view" id="view" hidden><video id="vid" playsinline muted></video><button class="ov tr" type="button" id="stop">멈춤</button><button class="ov bl" type="button" id="ovManual">코드 입력</button><div class="ovst" id="ovst"></div></div>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <div class="minor"><label class="link" for="cam" id="camBtn" tabindex="0">사진으로 읽기</label></div>
    <form class="row" id="f">
      <input id="q" type="text" inputmode="numeric" autocomplete="off" placeholder="품번 (예: 115108)" aria-label="품번 입력">
      <button class="btn2" type="submit">조회</button>
    </form>
    <div class="status" id="st" role="status"></div>
  </section>

  <section id="results" aria-live="polite"></section>

  <div class="legend" aria-label="색 구분">
    <span style="--c:var(--hs)">HS</span>
    <span style="--c:var(--jk)">Jazz·Korus</span>
    <span style="--c:var(--gs)">GS</span>
    <span style="--c:var(--hb)">ILS4 HB</span>
    <span style="--c:var(--uhc)">ILS4 UHC</span>
    <span style="--c:var(--ils1)">ILS1</span>
    <span style="--c:var(--eos)">단종</span>
    <span style="--c:var(--proj)">프로젝터</span>
  </div>

  <details id="all">
    <summary>렌즈 목록</summary>
    <div class="tbl"><table><thead><tr><th scope="col">품번</th><th scope="col">렌즈</th><th scope="col">마운트</th></tr></thead><tbody id="tb"></tbody></table></div>
  </details>

  <p class="foot">출처 christiedigital.com (20261020) · 시네마 제외</p>
</div>

const HS_SMALL={'140-109101':'1.70-2.12:1','140-110103':'2.12-2.83:1','140-111104':'2.83-5.66:1','140-116109':'5.66-10.8:1'};
const BASE='https://www.christiedigital.com/products/all-accessories/lenses/';
const $=id=>document.getElementById(id);
const norm=c=>c.replace(/\D/g,'');

// 문자열에서 품번 후보(2~3자리-6자리) 추출. 하이픈 없는 바코드(예 14011510802)도 처리
function candidates(txt){
  const out=new Set();
  const t=String(txt).toUpperCase();
  for(const m of t.matchAll(/(\d{2,3})-?(\d{6})/g)) out.add(m[1]+m[2]);
  return [...out];
}
function lookup(q){
  const d=norm(q); if(d.length<4) return [];
  const hit=r=>{const n=norm(r[0]);return n===d||n===d.slice(0,n.length)&&d.length<=n.length+2||n.endsWith(d)||n.includes(d)};
  const cur=CUR.filter(hit).map(r=>({code:r[0],name:r[1],m:r[2],compat:r[3],url:BASE+r[4],spec:r[2]==='hs'&&HS_SMALL[r[0]]?'4K7·4K10-HS에서는 '+HS_SMALL[r[0]]:''}))
    .concat(PROJ.filter(hit).map(r=>({code:r[0],name:r[1],m:'proj',spec:r[3],url:r[4]})))
    .concat(PROJ_EOS.filter(hit).map(r=>({code:r[0],name:r[1],m:'eosproj',spec:r[3],url:r[4]})));
  const eos=EOS.filter(r=>hit(r)).map(r=>({code:r[0],name:r[1],m:'eos'}));
  return cur.concat(eos);
}
function render(list,raw){
  const box=$('results'); box.textContent='';
  if(!list.length){
    const p=document.createElement('p');p.className='note miss'; // miss: 스캔 중에도 보이는 '목록에 없음'(U1·U4)
    p.textContent=`${raw}: 목록에 없음 - 박스 라벨의 품번을 확인하세요`; // U5(F-11): 할 일 문장
    box.append(p);return;
  }
  const codes=new Set(list.map(x=>x.code));
  if(list.length>1&&codes.size===1&&list[0].m!=='eos'){
    const p=document.createElement('p');p.className='note';
    p.textContent='HS·Jazz·Korus 공용 렌즈';
    box.append(p);
  }
  // U6(F-12, 20261020 UI-개선): 여러 품번이 걸리면 건수와 할 일을 알린다(부분 일치라 정확히 맞는 것이 어느 것인지 몰랐다). 12장 넘게 잘리면 그것도 알린다.
  if(codes.size>1&&raw){ // 직접 입력일 때만(사진 한 장에 바코드 여러 개는 부분 일치가 아님 - S7 검수 #2)
    const p=document.createElement('p');p.className='note';
    p.textContent=list.length>12?`${list.length}건 일치 · 12건만 표시 - 품번을 더 입력하세요`:`${list.length}건 일치 - 품번 전체를 확인하세요`;
    box.append(p);
  }
  for(const x of list.slice(0,12)){
    const [label,c]=MOUNT[x.m];
    const el=document.createElement('article');el.className='card';el.style.setProperty('--c',c);
    el.innerHTML=`<div class="code"></div><div class="name"></div><span class="tag"></span>`;
    el.querySelector('.code').textContent=x.code;
    el.querySelector('.name').textContent=x.name;
    el.querySelector('.tag').textContent=label;
    if(x.spec){const d=document.createElement('div');d.className='spec';d.textContent=x.spec;el.append(d)}
    if(x.compat){const d=document.createElement('div');d.className='compat';d.innerHTML='<b>호환</b> ';d.append(x.compat);el.append(d)}
    if(x.url){const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent='공식 페이지';el.append(a)}
    box.append(el);
  }
}

// 바코드 판독: 1) 브라우저 내장 BarcodeDetector(여러 개 동시) 2) ZXing으로 전체·상하·좌우 구역 각각 시도
async function decodeAll(img){
  const found=new Set();
  if('BarcodeDetector' in window){
    try{const bd=new BarcodeDetector();(await bd.detect(img)).forEach(r=>found.add(r.rawValue))}catch(_){}
  }
  if(window.ZXing){
    const Z=ZXing;
    const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);
    const reader=new Z.MultiFormatReader();reader.setHints(hints);
    const W=img.naturalWidth,H=img.naturalHeight,s=Math.min(1,1600/Math.max(W,H));
    const regions=[[0,0,1,1],[0,0,1,.5],[0,.5,1,.5],[0,0,.5,1],[.5,0,.5,1],[0,.25,1,.5]];
    for(const [x,y,w,h] of regions){
      for(const rot of [0,90]){
        const cv=document.createElement('canvas');
        const sw=W*w,sh=H*h,cw=Math.round(sw*s),ch=Math.round(sh*s);
        cv.width=rot?ch:cw;cv.height=rot?cw:ch;
        const g=cv.getContext('2d');
        if(rot){g.translate(ch,0);g.rotate(Math.PI/2)}
        g.drawImage(img,W*x,H*y,sw,sh,0,0,cw,ch);
        try{
          const src=new Z.HTMLCanvasElementLuminanceSource(cv);
          const r=reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src)));
          found.add(r.getText());
        }catch(_){}
        reader.reset();
      }
    }
  }
  return [...found];
}
$('cam').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  status('읽는 중…');$('results').textContent='';
  const url=URL.createObjectURL(f);const img=new Image();
  img.onload=async()=>{
    let texts=[];
    try{texts=await decodeAll(img)}catch(_){}
    URL.revokeObjectURL(url);e.target.value='';
    if(!texts.length){status('읽지 못함 - 다시 찍거나 품번을 입력하세요',true);return} // U5(F-11)
    const cands=[...new Set(texts.flatMap(candidates))];
    const hits=[];const seen=new Set();
    for(const c of cands) for(const x of lookup(c)){const k=x.code+x.name;if(!seen.has(k)){seen.add(k);hits.push(x)}}
    $('q').value=cands[0]?cands[0].replace(/^(\d{2,3})(\d{6})$/,'$1-$2'):texts[0];
    if(hits.length){status(texts.join(' / '));render(hits,'')}
    else{status(texts.join(' / '));render([],texts.join(' / '))}
  };
  img.onerror=()=>{status('사진 열기 실패',true)};
  img.src=url;
});

// 실시간 스캔: 후면 카메라 → 0.25초마다 프레임 판독 → 품번이면 멈추고 결과 표시
let stream=null,timer=null,busy=false,lastKey="";
const vid=$('vid');
function stopLive(){document.body.classList.remove('scanning');clearInterval(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('view').hidden=true;$('live').textContent='카메라로 스캔'}
function showHits(texts){
  // texts는 중앙에 가까운 순. 목록에 있는 품번이 나오는 첫 바코드만 결과로 쓴다
  const cands=[...new Set(texts.flatMap(candidates))];
  for(const c of cands){const hits=lookup(c).filter(x=>norm(x.code)===c);if(hits.length)return {cands:[c],hits}}
  return {cands,hits:[]};
}

// 노란 칸(.aim) 영역만 잘라 판독 — 칸 밖 바코드는 무시. video는 object-fit:cover라 화면→영상 좌표 환산
// 멀리서 읽기: 연속 자동초점 + 두 손가락 핀치 확대.
// 카메라가 광학/센서 줌을 지원하면(안드로이드 크롬 등) 그 줌을, 아니면(아이폰 사파리 등) 화면 확대(digital)를 쓴다.
let zTrack=null,zCap=null,zVal=1,dz=1;
async function setupZoom(track){
  zTrack=track;dz=1;vid.style.transform='';
  try{await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(_){}
  const c=track.getCapabilities?track.getCapabilities():{};
  zCap=c.zoom||null;zVal=zCap?Math.min(2,zCap.max):1;
  if(zCap)try{await track.applyConstraints({advanced:[{zoom:zVal}]})}catch(_){zCap=null}
}
function setZoom(f){
  if(zCap){zVal=Math.min(zCap.max,Math.max(zCap.min,f));zTrack.applyConstraints({advanced:[{zoom:zVal}]}).catch(()=>{})}
  else{dz=Math.min(4,Math.max(1,f));vid.style.transform='scale('+dz+')'}
}
(()=>{const v=$('view');let d0=0,z0=1;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  v.addEventListener('touchstart',e=>{if(e.touches.length===2){d0=dist(e.touches);z0=zCap?zVal:dz}},{passive:true});
  v.addEventListener('touchmove',e=>{if(e.touches.length===2&&d0){e.preventDefault();setZoom(z0*dist(e.touches)/d0)}},{passive:false});
  v.addEventListener('touchend',()=>{d0=0});
})();
// 화면에 보이는 영역 전체를 판독(인식 칸 없음). 바코드가 여러 개면 모두 읽고, 목록에 있는 품번만 결과로 낸다.
function viewCanvas(){
  const W=vid.videoWidth,H=vid.videoHeight;if(!W)return null;
  const v=$('view').getBoundingClientRect();
  const s=Math.max(v.width/W,v.height/H)*dz,sw=v.width/s,sh=v.height/s,sx=(W-sw)/2,sy=(H-sh)/2;
  const up=Math.max(1,1400/sw);const cv=document.createElement('canvas');cv.width=Math.round(sw*up);cv.height=Math.round(sh*up);
  cv.getContext('2d').drawImage(vid,sx,sy,sw,sh,0,0,cv.width,cv.height);
  return cv;
}
// ZXing은 한 번에 1개만 읽으므로 전체 + 띠 구역을 돌아가며 판독하고, 최근 2초간 읽은 값을 합친다
const seen=new Map();let tick=0;
const STRIPS=[[0,0,1,1],[0,0,1,.4],[0,.3,1,.4],[0,.6,1,.4],[0,0,.6,1],[.4,0,.6,1]];
async function frameTexts(){
  const now=Date.now();
  const cv=viewCanvas();if(!cv)return[];
  // 화면 중앙까지 거리(0=중앙, 1=모서리)를 함께 기록
  const put=(t,x,y)=>seen.set(t,{t:now,d:Math.hypot(x/cv.width-.5,y/cv.height-.5)/0.7071});
  if('BarcodeDetector' in window){try{(await new BarcodeDetector().detect(cv)).forEach(r=>{const b=r.boundingBox;put(r.rawValue,b.x+b.width/2,b.y+b.height/2)})}catch(_){}}
  if(window.ZXing){
    const Z=ZXing;
    const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.ITF,Z.BarcodeFormat.QR_CODE,Z.BarcodeFormat.DATA_MATRIX]);
    const rd=new Z.MultiFormatReader();rd.setHints(hints);
    for(const [x,y,w,h] of [STRIPS[0],STRIPS[1+(tick++%(STRIPS.length-1))]]){
      const c=document.createElement('canvas');c.width=Math.round(cv.width*w);c.height=Math.round(cv.height*h);
      c.getContext('2d').drawImage(cv,cv.width*x,cv.height*y,c.width,c.height,0,0,c.width,c.height);
      try{const r=rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))));const ps=r.getResultPoints()||[];
        const px=ps.length?ps.reduce((a,p)=>a+p.getX(),0)/ps.length:c.width/2,py=ps.length?ps.reduce((a,p)=>a+p.getY(),0)/ps.length:c.height/2;
        put(r.getText(),cv.width*x+px,cv.height*y+py)}catch(_){}
      rd.reset();
    }
  }
  for(const [k,v] of seen) if(now-v.t>2000) seen.delete(k);
  return [...seen.keys()].sort((a,b)=>seen.get(a).d-seen.get(b).d); // 중앙에 가까운 순
}
$('live').addEventListener('click',async()=>{
  if(stream){stopLive();status('');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status('카메라 미지원 - 품번을 입력하세요',true);return} // U5(F-11)
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}},audio:false});
  }catch(err){status('카메라 권한 필요 - 브라우저 설정에서 카메라를 허용하거나 품번을 입력하세요',true);stream=null;return} // U5(F-11·F-19): 문구만, 동작 그대로
  vid.srcObject=stream;await vid.play();
  setupZoom(stream.getVideoTracks()[0]);
  $('view').hidden=false;document.body.classList.add('scanning');$('live').textContent='스캔 멈추기';$('results').textContent='';
  seen.clear();lastKey="";status("");
  timer=setInterval(async()=>{
    if(busy)return;busy=true;
    try{
      const texts=await frameTexts();
      if(texts.length){
        const {cands,hits}=showHits(texts);
        // 연속 스캔: 카메라는 켠 채로 두고, 다른 품번을 읽었을 때만 결과를 바꾼다(같은 박스면 깜빡임·진동 없음)
        const key=hits.map(x=>x.code).join(',');
        if(hits.length&&key===lastKey){/* 같은 렌즈 — 그대로 둔다 */}
        else if(hits.length){
          lastKey=key;if(navigator.vibrate)navigator.vibrate(80);
          $('q').value=cands[0].replace(/^(\d{2,3})(\d{6})$/,'$1-$2');
          status(texts.join(' / '));render(hits,'');
        }else if(cands.length){
          // 품번 형식인데 목록에 없음 → 이전 결과를 지우고 '목록에 없음' 표시
          const k='x:'+cands.join();if(k!==lastKey){lastKey=k;render([],cands.map(c=>c.replace(/^(\d{2,3})(\d{6})$/,'$1-$2')).join(' / '))}
          status(texts.join(' / '));
        }else status(texts.join(' / ')+' - 품번 아님');
      }
    }finally{busy=false}
  },250);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream)stopLive()});
